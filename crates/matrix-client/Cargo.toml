[package]
name = "matrix-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal application crate; not intended for crates.io.
publish = false

[lints]
workspace = true

[lib]
name = "matrix_client"
# Plain `rlib` only. This crate deliberately carries no `flutter_rust_bridge`
# macros and no `cdylib` output — the bridge crate at `flutter/rust` depends
# on this one as a path dependency and owns the FFI-facing surface. Keeping
# the split means this crate stays testable with plain `cargo test`.
crate-type = ["rlib"]

[dependencies]
# Pinned to 0.19.1: the same release `matrix-sdk-ffi` 0.19.1 (Element X's own
# bindings crate) is built from, verified against matrix-rust-sdk's published
# Cargo.toml on 2026-11-06. `default-features = false` plus an explicit
# feature list keeps TLS on `rustls` (via `rustls-aws-lc-rs`, the feature
# name matrix-sdk 0.19.1 actually exposes — not the hoped-for "rustls-tls",
# verified via the version-resolution error `cargo check` raised against
# matrix-sdk's real feature list) — `deny.toml` bans `openssl-sys`
# workspace-wide.
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "rustls-aws-lc-rs",
    "sqlite",
    "e2e-encryption",
] }
# Same release line as `matrix-sdk` above (released in lockstep from the
# same `matrix-rust-sdk` workspace). Provides `SyncService`/
# `RoomListService`/`Timeline` — the same stack Element X runs on top of
# `matrix-sdk`, rather than hand-rolling sliding sync ourselves.
# `default-features = false`: its default pulls an optional `uniffi`
# feature we don't use (no UniFFI anywhere in this project, see
# docs/ARCHITECTURE.md's bridge-mechanism decision).
matrix-sdk-ui = { version = "0.19.1", default-features = false }
# `UtdCause` (why a message couldn't be decrypted) for the "unable to
# decrypt" placeholder in `timeline.rs` — matrix-sdk doesn't re-export
# it itself, so this needs to be a direct dependency. Already in the
# graph transitively at this exact version via matrix-sdk/matrix-sdk-ui.
matrix-sdk-base = { version = "0.19.1", default-features = false, features = [
    "e2e-encryption",
] }
# `StreamExt::map` for turning the timeline's `VectorDiff` updates into
# plain snapshot updates in `RoomTimeline::subscribe_messages` — already
# in the dependency graph transitively via `matrix-sdk`, pinned loosely
# since this crate isn't picky about the exact patch version.
futures-util = "0.3"
# `stream!` macro for `RoomTimeline::subscribe_messages`'s cancellable
# loop — already in the dependency graph transitively (matrix-sdk-ui
# uses it internally for the same reason).
async-stream = "0.3"
# `CancellationToken` so `RoomTimeline::stop()` can actually interrupt
# `subscribe_messages`'s loop instead of leaving it parked forever on a
# quiet room — already in the dependency graph transitively via tokio's
# own ecosystem.
tokio-util = "0.7"
# `select!`/`pin!` for the same cancellation race — needs to be a direct
# dependency (not just transitive via matrix-sdk) for the macros to
# resolve `tokio::` paths in this crate.
tokio = { version = "1", default-features = false, features = ["macros"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `matrix-sdk`'s own `testing` feature, enabled only for dev-dependency
# builds via Cargo's normal/dev feature unification — gates
# `matrix_sdk::test_utils::mocks::MatrixMockServer`, an in-process mock
# homeserver (wiremock-based). Same mechanism `matrix-sdk-ui`'s own test
# suite uses for its `SpaceService` tests (`matrix-sdk-ui-0.19.1/src/
# spaces/mod.rs`) — lets `rooms()`/`spaces()`/`space_rooms()` be
# regression-tested with plain `cargo test`, no real network or
# credentials, unlike `examples/sync_smoke_test.rs`.
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "rustls-aws-lc-rs",
    "sqlite",
    "e2e-encryption",
    "testing",
] }
matrix-sdk-test = "0.19.1"
